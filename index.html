<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL & Title Swapper</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-primary: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #334155;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--border-color);
        }
        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 1.5rem;
            text-align: center;
            font-weight: 600;
        }
        .input-group {
            margin-bottom: 1.25rem;
        }
        label {
            display: block;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
            color: #94a3b8;
        }
        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            color: var(--text-color);
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: var(--accent-primary);
        }
        button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            background-color: var(--accent-primary);
            color: white;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 0.5rem;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>URL & Title Swapper</h1>
        
        <div class="input-group">
            <label for="prefixInput">At the start of this put:</label>
            <input type="text" id="prefixInput" value="google.com" placeholder="e.g. google.com">
        </div>

        <button id="startBtn">Start Swapping</button>
    </div>

    <script>
        const prefixInput = document.getElementById('prefixInput');
        const startBtn = document.getElementById('startBtn');
        let intervalId = null;

        function getRandomString(length = 8) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function updateRandomState() {
            const prefix = prefixInput.value;
            const randomSuffix = getRandomString(8);

            document.title = prefix + randomSuffix;
            window.location.hash = prefix + randomSuffix;
        }

        startBtn.addEventListener('click', () => {
            if (intervalId) {
                clearInterval(intervalId);
            }
            updateRandomState();
            intervalId = setInterval(updateRandomState, 20);
            startBtn.textContent = 'Running (Click to Restart)';
        });
    </script>
</body>
</html>
